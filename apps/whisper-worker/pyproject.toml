[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-worker"
version = "0.1.0"
description = "Minimal whisper worker bootstrap for obsidian-local-ai-platform"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1,<4.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
faster-whisper = [
  "faster-whisper>=1.1,<2.0",
]

[project.scripts]
whisper-worker = "whisper_worker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
