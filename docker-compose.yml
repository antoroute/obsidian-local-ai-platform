services:
  reverse-proxy:
    image: traefik:v3.1
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - proxy
    depends_on:
      ai-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-gateway:
    build:
      context: ./apps/ai-gateway
    environment:
      AI_GATEWAY_HOST: ${AI_GATEWAY_HOST:-0.0.0.0}
      AI_GATEWAY_PORT: ${AI_GATEWAY_PORT:-8000}
      AI_GATEWAY_LOG_LEVEL: ${AI_GATEWAY_LOG_LEVEL:-info}
      AI_GATEWAY_REQUEST_MAX_BYTES: ${AI_GATEWAY_REQUEST_MAX_BYTES:-10485760}
      AI_GATEWAY_DATABASE_URL: ${AI_GATEWAY_DATABASE_URL:-postgresql+psycopg://app:change-me@postgres:5432/obsidian_ai}
      AI_GATEWAY_REDIS_URL: ${AI_GATEWAY_REDIS_URL:-redis://redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-GET,POST,OPTIONS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-Authorization,Content-Type}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-mistral:latest}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-mistral:latest,qwen2.5:14b,llama3:latest}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      MAX_NOTE_CHARS: ${MAX_NOTE_CHARS:-200000}
      MAX_TEMPLATE_CHARS: ${MAX_TEMPLATE_CHARS:-50000}
      MAX_TRANSCRIPT_CHARS: ${MAX_TRANSCRIPT_CHARS:-300000}
      MAX_MANUAL_NOTES_CHARS: ${MAX_MANUAL_NOTES_CHARS:-100000}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-100}
      MAX_ASSISTANT_MESSAGE_CHARS: ${MAX_ASSISTANT_MESSAGE_CHARS:-20000}
      MAX_ASSISTANT_CONTEXT_CHARS: ${MAX_ASSISTANT_CONTEXT_CHARS:-100000}
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-/data/audio}
      MAX_AUDIO_UPLOAD_MB: ${MAX_AUDIO_UPLOAD_MB:-500}
      AUDIO_QUEUE_NAME: ${AUDIO_QUEUE_NAME:-audio_transcription_jobs}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-pgvector}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-ollama}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text:latest}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-768}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-900}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
      RAG_MAX_CHUNKS_PER_QUERY: ${RAG_MAX_CHUNKS_PER_QUERY:-8}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-24000}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.25}
      RAG_INDEX_EXCLUDED_DIRS: ${RAG_INDEX_EXCLUDED_DIRS:-.obsidian,Templates,Archives,Private}
      RAG_INDEX_EXCLUDED_TAGS: ${RAG_INDEX_EXCLUDED_TAGS:-noai,private}
      RAG_DEFAULT_VAULT_ID: ${RAG_DEFAULT_VAULT_ID:-default}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - proxy
      - ai_internal
    volumes:
      - audio-storage:/data/audio
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/v1/health').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-obsidian-local-ai-platform}_proxy
      - traefik.http.routers.ai-gateway-web.rule=Host(`${PUBLIC_BASE_HOST:-localhost}`)
      - traefik.http.routers.ai-gateway-web.entrypoints=web
      - traefik.http.routers.ai-gateway-web.middlewares=ai-gateway-security
      - traefik.http.routers.ai-gateway-websecure.rule=Host(`${PUBLIC_BASE_HOST:-localhost}`)
      - traefik.http.routers.ai-gateway-websecure.entrypoints=websecure
      - traefik.http.routers.ai-gateway-websecure.tls=true
      - traefik.http.routers.ai-gateway-websecure.middlewares=ai-gateway-security
      - traefik.http.services.ai-gateway.loadbalancer.server.port=8000
      - traefik.http.middlewares.ai-gateway-security.headers.frameDeny=true
      - traefik.http.middlewares.ai-gateway-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.ai-gateway-security.headers.browserXssFilter=true
      - traefik.http.middlewares.ai-gateway-security.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.ai-gateway-security.headers.customResponseHeaders.X-Robots-Tag=noindex,nofollow,noarchive,nosnippet
      - traefik.http.middlewares.ai-gateway-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.ai-gateway-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.ai-gateway-security.headers.stsPreload=true
    restart: unless-stopped

  whisper-worker:
    build:
      context: ./apps/whisper-worker
    environment:
      WHISPER_WORKER_LOG_LEVEL: ${WHISPER_WORKER_LOG_LEVEL:-info}
      WHISPER_WORKER_DATABASE_URL: ${WHISPER_WORKER_DATABASE_URL:-postgresql+psycopg://app:change-me@postgres:5432/obsidian_ai}
      WHISPER_WORKER_REDIS_URL: ${WHISPER_WORKER_REDIS_URL:-redis://redis:6379/0}
      WHISPER_WORKER_QUEUE: ${WHISPER_WORKER_QUEUE:-audio_transcription_jobs}
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-/data/audio}
      TRANSCRIPTION_ENGINE: ${TRANSCRIPTION_ENGINE:-faster_whisper}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_MODEL_CACHE_DIR: ${WHISPER_MODEL_CACHE_DIR:-/models/whisper}
      HF_HOME: ${HF_HOME:-/models/whisper}
      HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/models/whisper/hub}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ai_internal
    volumes:
      - audio-storage:/data/audio
      - whisper-model-cache:/models/whisper
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obsidian_ai}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - ai_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai_internal
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
  ai_internal:
    driver: bridge
    internal: true

volumes:
  audio-storage:
  whisper-model-cache:
  postgres-data:
  ollama-data:
