services:
  reverse-proxy:
    profiles:
      - container-proxy
    ports: []

  ai-gateway:
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:8b}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-qwen3:8b}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_BIND_PORT:-8000}:8000"

  whisper-worker:
    environment:
      TRANSCRIPTION_ENGINE: faster_whisper
