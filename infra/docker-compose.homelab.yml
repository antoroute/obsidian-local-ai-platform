name: obsidian-ai

services:
  ai-gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/antoroute/obsidian-local-ai-platform-ai-gateway:main}
    pull_policy: always
    init: true
    environment:
      AI_GATEWAY_HOST: 0.0.0.0
      AI_GATEWAY_PORT: 8000
      AI_GATEWAY_LOG_LEVEL: ${AI_GATEWAY_LOG_LEVEL:-info}
      AI_GATEWAY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-obsidian_ai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-obsidian_ai}
      AI_GATEWAY_REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.0.70.10:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_CONCURRENT_REQUESTS: ${OLLAMA_MAX_CONCURRENT_REQUESTS:-1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:8b}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-qwen3:8b}
      CORS_ENABLED: "true"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-app://obsidian.md,capacitor://localhost,http://localhost}
      CORS_ALLOW_METHODS: GET,POST,DELETE,OPTIONS
      CORS_ALLOW_HEADERS: Authorization,Content-Type
      CORS_ALLOW_CREDENTIALS: "false"
      MAX_NOTE_CHARS: ${MAX_NOTE_CHARS:-200000}
      MAX_TEMPLATE_CHARS: ${MAX_TEMPLATE_CHARS:-50000}
      MAX_TRANSCRIPT_CHARS: ${MAX_TRANSCRIPT_CHARS:-300000}
      MAX_MANUAL_NOTES_CHARS: ${MAX_MANUAL_NOTES_CHARS:-100000}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-100}
      MEETING_TRANSCRIPT_CLEANUP_ENABLED: "true"
      MEETING_PREDIGEST_ENABLED: "true"
      MEETING_PREDIGEST_MIN_CHARS: ${MEETING_PREDIGEST_MIN_CHARS:-12000}
      MEETING_PREDIGEST_CHUNK_CHARS: ${MEETING_PREDIGEST_CHUNK_CHARS:-24000}
      MEETING_PREDIGEST_MAX_CHUNKS: ${MEETING_PREDIGEST_MAX_CHUNKS:-10}
      MEETING_PREDIGEST_MANUAL_NOTES_MAX_CHARS: ${MEETING_PREDIGEST_MANUAL_NOTES_MAX_CHARS:-6000}
      MEETING_DEEP_THINK_ENABLED: "true"
      MEETING_DEEP_THINK_MAX_SECTIONS: ${MEETING_DEEP_THINK_MAX_SECTIONS:-6}
      MEETING_DEEP_THINK_EXCERPT_CHARS_PER_SECTION: ${MEETING_DEEP_THINK_EXCERPT_CHARS_PER_SECTION:-2000}
      MEETING_DEEP_THINK_FINAL_CLEANUP: "true"
      MAX_ASSISTANT_MESSAGE_CHARS: ${MAX_ASSISTANT_MESSAGE_CHARS:-20000}
      MAX_ASSISTANT_CONTEXT_CHARS: ${MAX_ASSISTANT_CONTEXT_CHARS:-100000}
      AUDIO_STORAGE_DIR: /data/audio
      MAX_AUDIO_UPLOAD_MB: ${MAX_AUDIO_UPLOAD_MB:-250}
      USAGE_QUOTAS_ENABLED: ${USAGE_QUOTAS_ENABLED:-true}
      DAILY_LLM_REQUESTS_PER_USER: ${DAILY_LLM_REQUESTS_PER_USER:-100}
      DAILY_EMBEDDING_REQUESTS_PER_USER: ${DAILY_EMBEDDING_REQUESTS_PER_USER:-5000}
      DAILY_AUDIO_JOBS_PER_USER: ${DAILY_AUDIO_JOBS_PER_USER:-20}
      MAX_ACTIVE_AUDIO_JOBS_PER_USER: ${MAX_ACTIVE_AUDIO_JOBS_PER_USER:-1}
      AUDIO_QUEUE_NAME: audio_transcription_jobs
      JOB_STALLED_AFTER_SECONDS: ${JOB_STALLED_AFTER_SECONDS:-900}
      JOB_HISTORY_LIMIT: ${JOB_HISTORY_LIMIT:-50}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WORKER_HEARTBEAT_KEY: obsidian_ai:whisper_worker:heartbeat
      DIARIZATION_SERVICE_URL: ${DIARIZATION_SERVICE_URL:-http://10.0.70.10:11434}
      RAG_ENABLED: "true"
      RAG_VECTOR_BACKEND: pgvector
      RAG_EMBEDDING_PROVIDER: ollama
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1024}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-900}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
      RAG_MAX_CHUNKS_PER_QUERY: ${RAG_MAX_CHUNKS_PER_QUERY:-8}
      RAG_MAX_CHUNKS_PER_DOCUMENT: ${RAG_MAX_CHUNKS_PER_DOCUMENT:-2}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-24000}
      RAG_SEARCH_CANDIDATES: ${RAG_SEARCH_CANDIDATES:-30}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.15}
      RAG_KEYWORD_BONUS_ENABLED: "true"
      RAG_KEYWORD_BONUS_MAX: ${RAG_KEYWORD_BONUS_MAX:-0.20}
      RAG_INDEX_EXCLUDED_DIRS: ${RAG_INDEX_EXCLUDED_DIRS:-.obsidian,Templates,Archives,Private}
      RAG_INDEX_EXCLUDED_TAGS: ${RAG_INDEX_EXCLUDED_TAGS:-noai,private}
      RAG_DEFAULT_VAULT_ID: ${RAG_DEFAULT_VAULT_ID:-default}
      RAG_WORKSPACE_ID: ${RAG_WORKSPACE_ID:-default}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-10.0.20.20}:${GATEWAY_BIND_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_backend
      - ollama_egress
    volumes:
      - audio-storage:/data/audio
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/v1/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  whisper-worker:
    image: ${WHISPER_WORKER_IMAGE:-ghcr.io/antoroute/obsidian-local-ai-platform-whisper-worker:main}
    pull_policy: always
    init: true
    environment:
      WHISPER_WORKER_LOG_LEVEL: ${WHISPER_WORKER_LOG_LEVEL:-info}
      WHISPER_WORKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-obsidian_ai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-obsidian_ai}
      WHISPER_WORKER_REDIS_URL: redis://redis:6379/0
      WHISPER_WORKER_QUEUE: audio_transcription_jobs
      AUDIO_STORAGE_DIR: /data/audio
      TRANSCRIPTION_ENGINE: faster_whisper
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_LANGUAGE: auto
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-3}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
      WHISPER_NUM_WORKERS: "1"
      WHISPER_MODEL_CACHE_DIR: /models/whisper
      HF_HOME: /models/whisper
      HUGGINGFACE_HUB_CACHE: /models/whisper/hub
      HF_HUB_OFFLINE: "1"
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_PROGRESS_MIN_INTERVAL_SECONDS: ${JOB_PROGRESS_MIN_INTERVAL_SECONDS:-2}
      WORKER_HEARTBEAT_KEY: obsidian_ai:whisper_worker:heartbeat
      WORKER_HEARTBEAT_TTL_SECONDS: "15"
      DIARIZATION_SERVICE_URL: ${DIARIZATION_SERVICE_URL:-http://10.0.70.10:11434}
      DIARIZATION_SERVICE_TOKEN: ${DIARIZATION_SERVICE_TOKEN:?DIARIZATION_SERVICE_TOKEN must be set}
      DIARIZATION_TIMEOUT_SECONDS: ${DIARIZATION_TIMEOUT_SECONDS:-1800}
    depends_on:
      ai-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_backend
    volumes:
      - audio-storage:/data/audio
      - whisper-model-cache:/models/whisper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    pids_limit: 512
    cpus: "2.0"
    mem_limit: 4g
    restart: unless-stopped

  whisper-model-preparer:
    image: ${WHISPER_WORKER_IMAGE:-ghcr.io/antoroute/obsidian-local-ai-platform-whisper-worker:main}
    pull_policy: always
    profiles:
      - prepare-model
    command: ["python", "-m", "whisper_worker", "prepare-model", "--model", "${WHISPER_MODEL_SIZE:-small}"]
    environment:
      TRANSCRIPTION_ENGINE: faster_whisper
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL_CACHE_DIR: /models/whisper
      HF_HOME: /models/whisper
      HUGGINGFACE_HUB_CACHE: /models/whisper/hub
    networks:
      - model_download
    volumes:
      - whisper-model-cache:/models/whisper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 2g
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obsidian_ai}
      POSTGRES_USER: ${POSTGRES_USER:-obsidian_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    networks:
      - ai_backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1536m
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    user: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "300", "10"]
    networks:
      - ai_backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

networks:
  ai_backend:
    driver: bridge
    internal: true
  ollama_egress:
    driver: bridge
  model_download:
    driver: bridge

volumes:
  audio-storage:
    name: obsidian-ai-audio
  whisper-model-cache:
    name: obsidian-ai-whisper-models
  postgres-data:
    name: obsidian-ai-postgres
  redis-data:
    name: obsidian-ai-redis
