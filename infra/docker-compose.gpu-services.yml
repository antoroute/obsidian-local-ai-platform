name: obsidian-ai-gpu

services:
  gpu-coordinator:
    build:
      context: ../apps/diarization-service
    image: ${DIARIZATION_IMAGE:-obsidian-ai-diarization:local}
    network_mode: host
    init: true
    environment:
      SERVICE_TOKEN: ${DIARIZATION_SERVICE_TOKEN:?DIARIZATION_SERVICE_TOKEN must be set}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/pyannote
      HUGGINGFACE_HUB_CACHE: /models/pyannote/hub
      TORCH_HOME: /models/pyannote/torch
      XDG_CACHE_HOME: /models/pyannote/cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      OLLAMA_BASE_URL: ${GPU_OLLAMA_BASE_URL:-http://127.0.0.1:11435}
      MODEL_CACHE_DIR: /models/pyannote
      MAX_UPLOAD_MB: ${MAX_AUDIO_UPLOAD_MB:-250}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - pyannote-model-cache:/models/pyannote
    tmpfs:
      - /tmp:size=1g,mode=1777
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 512
    mem_limit: 3500m
    restart: unless-stopped

volumes:
  pyannote-model-cache:
