name: CI and container images

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/obsidian-plugin/package-lock.json
      - name: Install dependencies
        working-directory: apps/obsidian-plugin
        run: npm ci
      - name: Type-check
        working-directory: apps/obsidian-plugin
        run: npm run check
      - name: Build plugin
        working-directory: apps/obsidian-plugin
        run: npm run build

  gateway:
    name: AI Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai-gateway/pyproject.toml
      - name: Install dependencies
        working-directory: apps/ai-gateway
        run: pip install .[dev]
      - name: Run tests
        working-directory: apps/ai-gateway
        run: pytest -q

  worker:
    name: Whisper worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/whisper-worker/pyproject.toml
      - name: Install dependencies
        working-directory: apps/whisper-worker
        run: pip install .[dev]
      - name: Run tests
        working-directory: apps/whisper-worker
        run: pytest -q

  publish-images:
    name: Publish ${{ matrix.name }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - plugin
      - gateway
      - worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ai-gateway
            context: apps/ai-gateway
            image: ghcr.io/antoroute/obsidian-local-ai-platform-ai-gateway
          - name: whisper-worker
            context: apps/whisper-worker
            image: ghcr.io/antoroute/obsidian-local-ai-platform-whisper-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
